{% extends 'base.html' %}
{% block content %}
<div class="container py-5" style="max-width: 520px;">

        {% csrf_token %}
        {{ form.as_p }}

    <p class="mt-3">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрируйтесь</a></p>
</div>
{% endblock %}
